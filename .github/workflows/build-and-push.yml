name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
          
      - name: Build and Test Application
        env:
          VITE_ENABLE_DEV_OTP: 'true'
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run lint
          npm run test
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: hyd.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: hyd.ocir.io/axekmbadoczl/food-delivery/food-delivery-app-ui:${{ github.sha }}
          platforms: linux/arm64

      - name: Checkout Deployment Repo
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/Deployment
          path: deps/Deployment
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Clean up old Docker images
        run: python3 deps/Deployment/retention.py --apply --service food-delivery-app-ui

      - name: Update .versions file
        working-directory: deps/Deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            # Always start fresh from the remote
            git fetch origin main
            git reset --hard origin/main

            TAG_VAR="FOOD_DELIVERY_APP_UI_TAG"
            if grep -q "^${TAG_VAR}=" .versions; then
              sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${{ github.sha }}/g" .versions
            else
              echo "${TAG_VAR}=${{ github.sha }}" >> .versions
            fi

            # Check if there are changes to commit
            if git diff --quiet; then
              echo "No changes to commit"
              break
            fi

            git commit -am "Update ${TAG_VAR} with new image tag"
            
            if git push origin HEAD:main; then
              echo "Successfully updated .versions!"
              break
            fi
            
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
            
            echo "Push rejected due to race condition. Retrying ($i/$MAX_RETRIES)..."
            sleep $((1 + RANDOM % 5))
          done

      - name: Trigger Contract Verification
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}
          repository: parthu-reddy/FoodDeliveryContracts
          event-type: module-pushed
