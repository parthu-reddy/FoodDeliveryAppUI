name: Build and Push Docker Image

on:
  # push:
    # branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout CustomerApplication
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/CustomerApplication
          path: deps/CustomerApplication
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout RestaurantApplication
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/RestaurentApplication
          path: deps/RestaurantApplication
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout DeliveryExecutiveApplication
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/DeliveryExecutiveApplication
          path: deps/DeliveryExecutiveApplication
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout IdentityService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/IdentityService
          path: deps/IdentityService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout WalletService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/WalletService
          path: deps/WalletService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout PaymentGatewayIntegration
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/PaymentService
          path: deps/PaymentGatewayIntegration
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout MapsIntegration
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/MapsIntegration
          path: deps/MapsIntegration
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout CommunicationService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/CommunicationService
          path: deps/CommunicationService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout CampaignService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/CampaignService
          path: deps/CampaignService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout GovernmentIDValidationService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/GovernmentIDValidationService
          path: deps/GovernmentIDValidationService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout LedgerService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/LedgerService
          path: deps/LedgerService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout UserTrackingService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/UserTrackingService
          path: deps/UserTrackingService
          token: ${{ secrets.CHECKOUT_TOKEN }}

      # Added 2026-09-13. scripts/generate-api-types.sh has listed "reviews ReviewsService/openapi.json"
      # since the reviews integration landed, but this checkout was never added, so the generator
      # aborted with "ReviewsService/openapi.json is empty or missing". It stayed hidden because the
      # UI workflow had not completed since before that work: Actions minutes were exhausted, and
      # every build workflow was unrunnable for an unrelated reason.
      - name: Checkout ReviewsService
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/ReviewsService
          path: deps/ReviewsService
          token: ${{ secrets.CHECKOUT_TOKEN }}
        

      - name: Move dependencies to parent
        run: mv deps/* ../
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
          
      - name: Build and Test Application
        env:
          VITE_ENABLE_DEV_OTP: 'true'
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: hyd.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      # Dead step: the body below was commented out, which left a step with a name and
      # neither `run` nor `uses`. GitHub rejects the entire workflow for that, so every
      # service build has been unrunnable (422 at dispatch) rather than merely skipping
      # this. Commented out with its body until the dispatch is wanted again.
      # - name: Trigger Contract Verification
#        uses: peter-evans/repository-dispatch@v3
#        with:
#          token: ${{ secrets.CHECKOUT_TOKEN }}
#          repository: parthu-reddy/FoodDeliveryContracts
#          event-type: module-pushed
      - name: Checkout Deployment Repo
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/Deployment
          path: deps/Deployment
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Clean up old Docker images
        run: python3 deps/Deployment/retention.py --apply --delete-all --service food-delivery-app-ui

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: hyd.ocir.io/axekmbadoczl/food-delivery/food-delivery-app-ui:${{ github.sha }}
          platforms: linux/arm64

      - name: Update deployment environment file
        working-directory: deps/Deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            git pull --rebase origin main

            mkdir -p env_deployments/dev
            ENV_FILE="env_deployments/dev/food-delivery-app-ui.env"
            echo "FOOD_DELIVERY_APP_UI_TAG=${{ github.sha }}" > "$ENV_FILE"

            if git diff --quiet; then
              echo "No changes to commit"
              break
            fi

            git add "$ENV_FILE"
            git commit -m "Update food-delivery-app-ui tag"
            
            if git push origin HEAD:main; then
              echo "Successfully updated deployment env file!"
              break
            fi
            
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
            
            echo "Push rejected. Retrying ($i/$MAX_RETRIES)..."
            git reset --hard HEAD~1
            git pull --rebase origin main
            sleep $((1 + RANDOM % 5))
          done

